<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Spotify Clone</title>
</head>
<body class="min-h-screen bg-gradient-to-b from-neutral-800 to-black text-white">
  <main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4 py-10">
    <div class="rounded-2xl bg-neutral-900 p-8 shadow-2xl">
      <div class="mb-6 flex items-center gap-2 text-green-500">
        <svg class="h-9 w-9" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="12"/><path d="M6 9.5c4-1.2 8.5-.8 12 1.2M6.8 12.7c3.3-.9 6.8-.5 9.7 1M7.6 15.6c2.6-.6 5.2-.3 7.4.8" stroke="#000" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        <span class="text-xl font-bold text-white">Spotify Clone</span>
      </div>
      <h1 class="mb-6 text-3xl font-bold">Đăng nhập</h1>

      <div id="notice" class="mb-4 hidden rounded-lg px-4 py-3 text-sm"></div>

      <form id="login-form" novalidate class="space-y-4">
        <div>
          <label for="email" class="mb-1 block text-sm font-semibold">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="ban@example.com"
            class="w-full rounded-md bg-neutral-800 px-4 py-3 outline-none focus:ring-2 focus:ring-white" />
          <p data-error="email" class="mt-1 text-sm text-red-400"></p>
        </div>
        <div>
          <label for="password" class="mb-1 block text-sm font-semibold">Mật khẩu</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu"
            class="w-full rounded-md bg-neutral-800 px-4 py-3 outline-none focus:ring-2 focus:ring-white" />
          <p data-error="password" class="mt-1 text-sm text-red-400"></p>
        </div>

        <div id="form-error" class="hidden rounded-lg border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-300"></div>

        <button type="submit"
          class="w-full rounded-full bg-green-500 py-3 font-bold text-black transition hover:scale-[1.02] hover:bg-green-400 disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:scale-100">
          Đăng nhập
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-neutral-400">
        Chưa có tài khoản?
        <a href="/register.html" class="font-semibold text-white underline hover:text-green-400">Đăng ký</a>
      </p>
    </div>
  </main>
  <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
