<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh sách sản phẩm | Đức Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800">
    <header class="border-b bg-white">
      <div class="mx-auto max-w-7xl px-4 py-4">
        <h1 class="text-2xl font-bold">🛍️ Đức Shop</h1>
        <p class="text-sm text-slate-500">Danh sách sản phẩm từ DummyJSON</p>
      </div>
    </header>

    <main class="mx-auto max-w-7xl space-y-6 px-4 py-6">
      <form id="filter-form" class="grid gap-3 rounded-xl bg-white p-4 shadow-sm ring-1 ring-slate-200 sm:grid-cols-2 lg:grid-cols-4">
        <div class="sm:col-span-2">
          <label for="search-input" class="mb-1 block text-sm font-medium">Tìm kiếm</label>
          <input
            id="search-input"
            type="search"
            placeholder="Nhập tên sản phẩm..."
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
          />
        </div>

        <div>
          <label for="category-select" class="mb-1 block text-sm font-medium">Danh mục</label>
          <select
            id="category-select"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
          >
            <option value="">Đang tải danh mục...</option>
          </select>
        </div>

        <div>
          <label for="sort-select" class="mb-1 block text-sm font-medium">Sắp xếp</label>
          <select
            id="sort-select"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
          >
            <option value="">Mặc định</option>
            <option value="title-asc">Tên A → Z</option>
            <option value="title-desc">Tên Z → A</option>
            <option value="price-asc">Giá tăng dần</option>
            <option value="price-desc">Giá giảm dần</option>
          </select>
        </div>
      </form>

      <p id="result-info" class="text-sm text-slate-500"></p>

      <div id="status"></div>

      <div id="product-grid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>

      <nav id="pagination" class="flex flex-wrap items-center justify-center gap-2" aria-label="Phân trang"></nav>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/list.js"></script>
  </body>
</html>
